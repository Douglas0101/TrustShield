services:
  postgres:
    image: postgres:15-alpine
    container_name: trustshield_postgres
    ports: ["5432:5432"]
    env_file: [../.env]                 # .env na raiz (ou symlink docker/.env -> ../.env)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-07-26T20-48-21Z
    container_name: trustshield_minio
    ports: ["9000:9000", "9001:9001"]
    env_file: [../.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mlflow:
    build:
      context: ..
      dockerfile: docker/mlflow.Dockerfile
    image: trustshield_mlflow:local
    container_name: trustshield_mlflow
    ports: ["5000:5000"]
    env_file: [../.env]
    environment:
      BACKEND_STORE_URI: ${BACKEND_STORE_URI}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    command: >
      mlflow server
      --backend-store-uri ${BACKEND_STORE_URI}
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: trustshield_api:local
    container_name: trustshield_api
    ports: ["8000:8000"]
    env_file: [../.env]
    environment:
      BACKEND_STORE_URI: ${BACKEND_STORE_URI}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATA_DIR: /app/data
      OUTPUTS_DIR: /app/outputs
      CONFIG_FILE: /app/config/config.yaml
    volumes:
      - ../data:/app/data:rw
      - ../outputs:/app/outputs:rw
      - ../mlruns:/app/mlruns:rw
      - ../config:/app/config:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
      mlflow:   { condition: service_healthy }
    healthcheck:
      # corrigido para /healthz (o seu main expõe este endpoint)
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    image: trustshield_dashboard:local
    container_name: trustshield_dashboard
    ports: ["8501:8501"]
    env_file: [../.env]
    environment:
      API_URL: ${API_URL:-http://trustshield_api:8000}
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      CONFIG_FILE: /app/config/config.yaml
    volumes:
      - ../outputs:/app/outputs:ro
      - ../config:/app/config:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
