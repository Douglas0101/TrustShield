services:
  # ---------- Armazenamento de artefatos (S3 compatível) ----------
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    # defaults evitam conflito; pode sobrescrever via env MINIO_HOST_PORT/MINIO_CONSOLE_HOST_PORT
    ports:
      - "${MINIO_HOST_PORT:-9900}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9901}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [trustshield-net]

  # cria o bucket 'mlflow' no MinIO (roda uma vez e encerra)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -x
        mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}
        mc ls minio/mlflow || mc mb minio/mlflow
        echo "Bucket 'mlflow' pronto."
    networks: [trustshield-net]
    restart: "no"

  # ---------- MLflow Tracking Server ----------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.1
    command:
      [
        "mlflow","server",
        "--host","0.0.0.0",
        "--port","5000",
        "--backend-store-uri","sqlite:////mlflow/mlflow.db",
        "--serve-artifacts",
        "--artifacts-destination","s3://mlflow"
      ]
    environment:
      MLFLOW_EXPOSE_PROMETHEUS: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
    volumes:
      - mlflow-data:/mlflow
    # publicar a UI no host em porta que não conflite
    ports:
      - "${MLFLOW_HOST_PORT:-5500}:5000"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [trustshield-net]

  # ---------- API (FastAPI) ----------
  trustshield-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn","src.api.main:app","--host","0.0.0.0","--port","8000","--workers","1"]
    environment:
      MODEL_PATH: ${MODEL_PATH:-outputs/models/default_model.joblib}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      PYTHONUNBUFFERED: "1"
    volumes:
      # RW para salvar .joblib durante treino (os demais são RO)
      - ../outputs:/app/outputs
      - ../config:/app/config:ro
      - ../data:/app/data:ro
      - ../secrets:/app/secrets:ro
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [trustshield-net]
    depends_on:
      mlflow:
        condition: service_started

  # ---------- Dashboard (Streamlit) ----------
  trustshield-dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    environment:
      # sempre use o NOME DO SERVIÇO na rede
      API_URL: ${API_URL:-http://trustshield-api:8000}
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8501:8501"
    depends_on:
      trustshield-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [trustshield-net]

networks:
  trustshield-net:
    driver: bridge

volumes:
  mlflow-data:
  minio-data:
