services:
  # ---------- Armazenamento de artefatos (S3 compatível) ----------
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_HOST_PORT:-9900}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9901}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [trustshield-net]

  # Serviço para criar o bucket 'mlflow' no MinIO (roda uma vez e encerra)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        mc mb minio/mlflow || true
        mc anonymous set public minio/mlflow
        exit 0
    restart: "no"
    networks: [trustshield-net]

  # ---------- Backend de metadados do MLflow ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # --- OTIMIZAÇÃO APLICADA ---
      # A porta do host agora é configurável via .env
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [trustshield-net]

  # ---------- Servidor de Tracking MLflow ----------
  mlflow:
    build:
      context: ..
      dockerfile: docker/mlflow.Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://${POSTGRES_USER:-mlflow_user}:${POSTGRES_PASSWORD:-mlflow_pass}@postgres:5432/${POSTGRES_DB:-mlflow_db}
      - --artifacts-destination
      - s3://mlflow/
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MLFLOW_HOST_PORT:-5500}:5000"
    restart: unless-stopped
    networks: [trustshield-net]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- API de Inferência e Treino ----------
  trustshield-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      MODEL_PATH: ${MODEL_PATH:-outputs/models/default_model.joblib}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../outputs:/app/outputs
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../secrets:/app/secrets:ro
    ports:
      - "${API_HOST_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [trustshield-net]
    depends_on:
      mlflow:
        condition: service_healthy

  # ---------- Dashboard (Streamlit) ----------
  trustshield-dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    environment:
      API_URL: http://trustshield-api:8000
    ports:
      # --- OTIMIZAÇÃO APLICADA ---
      - "${DASHBOARD_HOST_PORT:-8501}:8501"
    restart: unless-stopped
    networks: [trustshield-net]
    depends_on:
      trustshield-api:
        condition: service_healthy

# ---------- Volumes e Redes ----------
volumes:
  minio-data:
  postgres-data:

networks:
  trustshield-net:
    driver: bridge
