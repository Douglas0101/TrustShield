name: trustshield

networks:
  trustshield:
    name: trustshield

volumes:
  postgres_data:
  minio_data:

secrets:
  postgres_password:
    file: ../secrets/postgres_password.txt
  minio_root_user:
    file: ../secrets/minio_root_user.txt
  minio_root_password:
    file: ../secrets/minio_root_password.txt

x-common-env: &common_env
  TZ: America/Sao_Paulo

services:
  # ---------------------------------------------------------------------------
  # Banco de dados para o MLflow
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ts-postgres
    networks: [trustshield]
    environment:
      <<: *common_env
      POSTGRES_USER: mlflow
      POSTGRES_DB: mlflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO (S3 compatível)
  # - Host ports 19000/19001 para evitar conflito local na 9000
  # - Lê usuário/senha de secrets sem expor variáveis no ambiente
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: ts-minio
    networks: [trustshield]
    volumes:
      - minio_data:/data
    ports:
      - "19000:9000"  # S3 API (container continua 9000)
      - "19001:9001"  # Console
    secrets:
      - minio_root_user
      - minio_root_password
    entrypoint: ["/bin/sh","-c"]
    command: >
      export MINIO_ROOT_USER="$(cat /run/secrets/minio_root_user)" &&
      export MINIO_ROOT_PASSWORD="$(cat /run/secrets/minio_root_password)" &&
      exec minio server /data --console-address ":9001"
    restart: unless-stopped

  # Cria bucket(s) no MinIO de forma idempotente
  minio-init:
    image: minio/mc:latest
    container_name: ts-minio-init
    networks: [trustshield]
    depends_on:
      minio:
        condition: service_started
    secrets:
      - minio_root_user
      - minio_root_password
    entrypoint: ["/bin/sh","-c"]
    command: >
      set -e;
      until (mc alias set minio http://minio:9000 $(cat /run/secrets/minio_root_user) $(cat /run/secrets/minio_root_password)); do
        echo "Aguardando MinIO...";
        sleep 2;
      done;
      mc mb -p minio/mlflow || true;
      mc anonymous set private minio/mlflow || true;
      echo "Buckets MinIO prontos.";
    restart: "no"

  # ---------------------------------------------------------------------------
  # MLflow Tracking Server
  # - Usa Postgres como backend store e MinIO (S3) como artifact store
  # - Lê AWS_ACCESS_KEY_ID/SECRET via secrets em tempo de execução
  # - Usa imagem buildada do seu mlflow.Dockerfile
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: ..
      dockerfile: docker/mlflow.Dockerfile
    image: trustshield-mlflow:latest
    container_name: ts-mlflow
    networks: [trustshield]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      mlflow-dbinit:
        condition: service_completed_successfully
    secrets:
      - minio_root_user
      - minio_root_password
      - postgres_password
    environment:
      <<: *common_env
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    entrypoint: ["/bin/sh","-c"]
    command: >
      export AWS_ACCESS_KEY_ID="$(cat /run/secrets/minio_root_user)" &&
      export AWS_SECRET_ACCESS_KEY="$(cat /run/secrets/minio_root_password)" &&
      exec mlflow server
      --backend-store-uri postgresql+psycopg2://mlflow:$(cat /run/secrets/postgres_password)@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  # Prepara o schema do MLflow no Postgres (migrações)
  mlflow-dbinit:
    build:
      context: ..
      dockerfile: docker/mlflow.Dockerfile
    image: trustshield-mlflow:latest
    container_name: ts-mlflow-dbinit
    networks: [trustshield]
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
    entrypoint: ["/bin/sh","-c"]
    command: >
      mlflow db upgrade postgresql+psycopg2://mlflow:$(cat /run/secrets/postgres_password)@postgres:5432/mlflow
    restart: "no"

  # ---------------------------------------------------------------------------
  # API de inferência (FastAPI)
  # - Build com contexto na raiz -> resolve COPY de requirements.txt
  # - Healthcheck usa /healthz, já implementado no código
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ts-api
    networks: [trustshield]
    depends_on:
      - mlflow
    environment:
      <<: *common_env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_PATH: /app/outputs/models/default_model.joblib
    volumes:
      - ../outputs:/app/outputs
      - ../data:/app/data:ro
      - ../config:/app/config:ro
    command: >
      uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      # evita depender de curl/wget dentro da imagem
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz'); print('ok')\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dashboard (Streamlit)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    container_name: ts-dashboard
    networks: [trustshield]
    depends_on:
      - api
    environment:
      <<: *common_env
      API_URL: http://api:8000
    command: >
      streamlit run src/dashboard/app.py
      --server.headless=true
      --server.port=8501
      --server.fileWatcherType=none
      --server.runOnSave=false
    ports:
      - "8501:8501"
    restart: unless-stopped
