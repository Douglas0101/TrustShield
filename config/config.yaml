# Configuração Avançada TrustShield Enterprise
# Versão: 4.2.0-hpo-deep-learning

project:
  name: "TrustShield-Advanced"
  version: "4.2.0"
  random_state: 42

# === PATHS ===
paths:
  data:
    featured_dataset: "data/features/featured_dataset.parquet"
  models:
    output_dir: "outputs/models"

# === PREPROCESSING ===
preprocessing:
  features_to_drop:
    - "date"
    - "merchant_city"
    - "merchant_state"
    - "zip"
    - "address"
    - "card_id"
    - "merchant_id"
    - "errors"
    - "client_id"
    - "id_transaction"
  categorical_features:
    - "use_chip"
    - "gender"

# === MODELS ===
models:
  isolation_forest:
    params:
      n_estimators: 150
      contamination: 0.1
      max_features: 0.8
      bootstrap: true
      # n_jobs e random_state são adicionados dinamicamente no script

  autoencoder: # Novo modelo
    params:
      epochs: 50
      batch_size: 256
      contamination: 0.1

# === TRAINING ===
training:
  test_size: 0.15

# === HYPERPARAMETER OPTIMIZATION (HPO) ===
hyper_optimization:
  enabled: true
  library: optuna
  n_trials: 100 # Aumentado para uma busca mais intensiva
  space:
    n_estimators: [50, 500]   # Intervalo para número de árvores
    max_samples: [0.5, 1.0]     # Fração de amostras para treinar cada árvore
    max_features: [0.5, 1.0]    # Fração de features para treinar cada árvore

# === MLFLOW ===
mlflow:
  experiment_name: "TrustShield-Advanced"
  tracking_uri: "http://trustshield_mlflow:5000"